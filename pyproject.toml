[project]
name = "gcp-serverless-ingestion-framework"
version = "1.0.0"
description = "Ingestão de dados e deploy seletivo no GCP (Cloud Run, Cloud Scheduler, Secret Manager e BigQuery)"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-bigquery>=3.20",
    "mysql-connector-python>=8.4",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["shared", "functions"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
